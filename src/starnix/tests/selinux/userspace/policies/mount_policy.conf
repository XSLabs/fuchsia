# The context we want to assign to the filesystem via fscontext=
type test_mount_fscontext_t;
typeattribute test_mount_fscontext_t file_like_a;
allow test_mount_fscontext_t self:filesystem { associate };

# Allow tmpfs_t to associate with its own filesystem, to support creating temporary directories
# in /tmp using ScopedTempDir.
allow tmpfs_t self:filesystem { associate };

# All test domains in this policy need to be able to mount on a tmpfs_t
# directory, and use the CAP_SYS_ADMIN capability.
attribute test_mount_a;
allow test_mount_a tmpfs_t:dir { mounton };
allow test_mount_a self:capability { sys_admin };
allow test_mount_a test_mount_fscontext_t:filesystem { unmount };

# Domain that is allowed to mount but denied relabelto.
type test_mount_relabelto_denied_t;
typeattribute test_mount_relabelto_denied_t test_a, test_mount_a;
allow test_mount_relabelto_denied_t tmpfs_t:filesystem { mount relabelfrom };
neverallow test_mount_relabelto_denied_t test_mount_fscontext_t:filesystem { relabelto };
neverallow test_mount_relabelto_denied_t tmpfs_t:filesystem { relabelto };

# Domain that is allowed to mount but denied relabelfrom.
type test_mount_relabelfrom_denied_t;
typeattribute test_mount_relabelfrom_denied_t test_a, test_mount_a;
allow test_mount_relabelfrom_denied_t tmpfs_t:filesystem { mount };
allow test_mount_relabelfrom_denied_t test_mount_fscontext_t:filesystem { relabelto };
neverallow test_mount_relabelfrom_denied_t tmpfs_t:filesystem { relabelfrom };

# Domain that is allowed to both mount and relabel (from and to). It is deliberately not granted
# "relabelfrom" to "test_mount_fscontext_t", so that it can be used to verify that overriding node
# labels requires "relabelfrom" to the filesystem's final label, and not just to its original one.
type test_mount_relabel_allowed_t;
typeattribute test_mount_relabel_allowed_t test_a, test_mount_a;
allow test_mount_relabel_allowed_t tmpfs_t:filesystem { relabelfrom };
allow test_mount_relabel_allowed_t test_mount_fscontext_t:filesystem { mount relabelto };
neverallow test_mount_relabel_allowed_t test_mount_fscontext_t:filesystem { relabelfrom };

# Domain allowed to relabel tmpfs to the label it already has. Naming the existing label via
# "fscontext=" is still a relabel as far as the checks are concerned, so both "relabelfrom" and
# "relabelto" are required on tmpfs_t.
type test_mount_relabel_self_allowed_t;
typeattribute test_mount_relabel_self_allowed_t test_a, test_mount_a;
allow test_mount_relabel_self_allowed_t tmpfs_t:filesystem { mount relabelfrom relabelto unmount };

# Type used to override the label of the root node via "rootcontext=". It is allowed to
# "associate" with "tmpfs_t", so that applying it to a "tmpfs" mount is permitted.
type test_mount_rootcontext_t;
typeattribute test_mount_rootcontext_t file_like_a;
allow test_mount_rootcontext_t tmpfs_t:filesystem { associate };

# "test_mount_fscontext_t" is deliberately not allowed to "associate" with "tmpfs_t", so that it
# can be used to exercise the "associate" check on the node labeling options.
neverallow test_mount_fscontext_t tmpfs_t:filesystem { associate };

# Domain allowed to mount tmpfs and to relabel it, used to isolate the "associate" check for
# "rootcontext=". It is never granted "relabelfrom"/"relabelto" on the "dir" class, to verify
# that overriding node labels at mount time is gated on the "filesystem" class only.
type test_mount_rootcontext_allowed_t;
typeattribute test_mount_rootcontext_allowed_t test_a, test_mount_a;
allow test_mount_rootcontext_allowed_t tmpfs_t:filesystem { mount relabelfrom unmount };
allow test_mount_rootcontext_allowed_t test_mount_rootcontext_t:dir { getattr search };
neverallow test_mount_rootcontext_allowed_t tmpfs_t:dir { relabelfrom relabelto };
neverallow test_mount_rootcontext_allowed_t test_mount_rootcontext_t:dir { relabelfrom relabelto };

# Type used to label the nodes of a filesystem via "context=", in combination with "fscontext="
# naming a different label for the filesystem itself. It is allowed to "associate" with
# "test_mount_fscontext_t", the label that "fscontext=" applies to the filesystem.
type test_mount_context_t;
typeattribute test_mount_context_t file_like_a;
allow test_mount_context_t test_mount_fscontext_t:filesystem { associate };

# "test_mount_rootcontext_t" can "associate" with "tmpfs_t" but deliberately not with
# "test_mount_fscontext_t", so that it can be used to exercise the "associate" check against a
# filesystem label that was itself overridden by "fscontext=".
neverallow test_mount_rootcontext_t test_mount_fscontext_t:filesystem { associate };

# Domain allowed to relabel a "tmpfs" mount to "test_mount_fscontext_t" via "fscontext=", and to
# then override the labels of the nodes within it via "context=".
type test_mount_context_and_fscontext_t;
typeattribute test_mount_context_and_fscontext_t test_a, test_mount_a;
allow test_mount_context_and_fscontext_t tmpfs_t:filesystem { relabelfrom };
allow test_mount_context_and_fscontext_t test_mount_fscontext_t:filesystem { mount relabelto };
allow test_mount_context_and_fscontext_t test_mount_fscontext_t:filesystem { relabelfrom };
allow test_mount_context_and_fscontext_t test_mount_context_t:dir { getattr search };

# Domain that is permissive, used for testing hook consistency without permission checks.
type test_mount_permissive_t;
typeattribute test_mount_permissive_t test_a, test_mount_a;
permissive test_mount_permissive_t;

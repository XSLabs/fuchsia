# sysfs nodes and the sysfs superblock are labeled `unconfined_t` by the
# `genfscon sysfs / system_u:object_r:unconfined_t:s0` statement in the base policy, hence the
# `associate` rules below target `unconfined_t`.

# Labels used for testing `selinux_kernfs_init_security` when a parent sysfs directory has an
# explicit `security.selinux` xattr set (inheritance, `type_transition`, and `fscreate`).
type test_sysfs_parent_t, file_like_a;
allow test_sysfs_parent_t unconfined_t:filesystem { associate };

type test_sysfs_fscreate_t, file_like_a;
allow test_sysfs_fscreate_t unconfined_t:filesystem { associate };

type test_sysfs_transition_parent_t, file_like_a;
allow test_sysfs_transition_parent_t unconfined_t:filesystem { associate };

type test_sysfs_transition_dir_t, file_like_a;
allow test_sysfs_transition_dir_t unconfined_t:filesystem { associate };

type test_sysfs_transition_file_t, file_like_a;
allow test_sysfs_transition_file_t unconfined_t:filesystem { associate };

type_transition unconfined_t test_sysfs_transition_parent_t:dir test_sysfs_transition_dir_t;
type_transition unconfined_t test_sysfs_transition_dir_t:file test_sysfs_transition_file_t;

# Allow tmpfs_t to associate with its own filesystem for ScopedTempDir
allow tmpfs_t self:filesystem { associate };

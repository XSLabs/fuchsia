type test_inotify_file_t, file_like_a;

type test_inotify_no_watch_t, test_a;
type test_inotify_watch_t, test_a;
type test_inotify_watch_reads_t, test_a;
type test_inotify_watch_reads_only_t, test_a;

allow test_inotify_file_t tmpfs_t:filesystem { associate };

# Setting an inotify watch requires read access to the watched file.
allow test_a test_inotify_file_t:file { read };

# Domain that is not allowed to set any watch.
neverallow test_inotify_no_watch_t test_inotify_file_t:file { watch watch_reads };

# Domain that is allowed to set watches, but not to watch read-like events.
allow test_inotify_watch_t test_inotify_file_t:file { watch };
neverallow test_inotify_watch_t test_inotify_file_t:file { watch_reads };

# Domain that is allowed to set watches, including on read-like events.
allow test_inotify_watch_reads_t test_inotify_file_t:file { watch watch_reads };

# Domain that is granted "watch_reads", but not the base "watch" permission.
allow test_inotify_watch_reads_only_t test_inotify_file_t:file { watch_reads };
neverallow test_inotify_watch_reads_only_t test_inotify_file_t:file { watch };

# Allow the domain without any "watch" permission to create and read from sockets, to verify
# whether watches can be set on socket-like nodes (e.g. via "/proc/self/fd/").
allow test_inotify_no_watch_t self:unix_stream_socket { create read getattr };
allow test_inotify_no_watch_t self:lnk_file { read };

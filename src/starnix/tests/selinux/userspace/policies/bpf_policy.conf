# Needed to create bpf handles.
allow unconfined_t self:capability2 { perfmon bpf };

type bpf_map_none_t, test_a;
type bpf_map_read_t, test_a;
type bpf_map_write_t, test_a;
type bpf_map_read_write_t, test_a;
type bpf_map_create_t, test_a;

type bpf_no_prog_load_t, test_a;
type bpf_prog_load_t, test_a;

allow bpf_prog_load_t self:capability2 { perfmon bpf };
allow bpf_no_prog_load_t self:capability2 { perfmon bpf };

allow bpf_map_read_t unconfined_t:bpf { map_read };
neverallow bpf_map_read_t unconfined_t:bpf { map_write };
allow bpf_map_write_t unconfined_t:bpf { map_write };
neverallow bpf_map_write_t unconfined_t:bpf { map_read };
allow bpf_map_read_write_t unconfined_t:bpf { map_read map_write };
neverallow bpf_map_none_t unconfined_t:bpf { map_read map_write };
allow bpf_map_create_t self:bpf { map_create map_read map_write };

allow bpf_prog_load_t self:bpf { prog_load prog_run };
allow bpf_no_prog_load_t self:bpf { prog_run };
neverallow bpf_no_prog_load_t self:bpf { prog_load };

# Capability test domains to validate BPF capability check and audit behavior for:
# 1. CAP_BPF only
# 2. CAP_SYS_ADMIN only
# 3. Both CAP_BPF and CAP_SYS_ADMIN
# 4. Neither capability

type bpf_cap_bpf_only_t, test_a;
type bpf_cap_sys_admin_only_t, test_a;
type bpf_cap_both_t, test_a;
type bpf_cap_neither_t, test_a;

attribute bpf_cap_audit_test_domain_a;
typeattribute bpf_cap_bpf_only_t bpf_cap_audit_test_domain_a;
typeattribute bpf_cap_sys_admin_only_t bpf_cap_audit_test_domain_a;
typeattribute bpf_cap_both_t bpf_cap_audit_test_domain_a;
typeattribute bpf_cap_neither_t bpf_cap_audit_test_domain_a;

allow bpf_cap_audit_test_domain_a self:bpf { map_create map_read map_write prog_load prog_run };

# 1. CAP_BPF only
allow bpf_cap_bpf_only_t self:capability2 { bpf };
neverallow bpf_cap_bpf_only_t self:capability { sys_admin };

# 2. CAP_SYS_ADMIN only
allow bpf_cap_sys_admin_only_t self:capability { sys_admin };
neverallow bpf_cap_sys_admin_only_t self:capability2 { bpf };

# 3. Both CAP_BPF and CAP_SYS_ADMIN
allow bpf_cap_both_t self:capability2 { bpf };
allow bpf_cap_both_t self:capability { sys_admin };

# 4. Neither capability
neverallow bpf_cap_neither_t self:capability2 { bpf };
neverallow bpf_cap_neither_t self:capability { sys_admin };

type bpf_pin_no_read_t, test_a;
type bpf_pin_no_write_t, test_a;
type bpf_pin_no_map_read_t, test_a;
type bpf_pin_no_map_write_t, test_a;
type bpf_pin_no_prog_run_t, test_a;
type bpf_pin_all_rights_t, test_a;

allow bpf_pin_no_read_t unconfined_t:bpf { map_read map_write prog_run };
allow bpf_pin_no_write_t unconfined_t:bpf { map_read map_write prog_run };
allow bpf_pin_no_map_read_t unconfined_t:bpf { map_write prog_run };
neverallow bpf_pin_no_map_read_t unconfined_t:bpf { map_read };
allow bpf_pin_no_map_write_t unconfined_t:bpf { map_read prog_run };
neverallow bpf_pin_no_map_write_t unconfined_t:bpf { map_write };
allow bpf_pin_no_prog_run_t unconfined_t:bpf { map_read map_write };
neverallow bpf_pin_no_prog_run_t unconfined_t:bpf { prog_run };
allow bpf_pin_all_rights_t unconfined_t:bpf { map_read map_write prog_run };

allow bpf_pin_no_read_t unconfined_t:file { write };
neverallow bpf_pin_no_read_t unconfined_t:file { read };
allow bpf_pin_no_write_t unconfined_t:file { read };
neverallow bpf_pin_no_write_t unconfined_t:file { write };
allow bpf_pin_no_map_read_t unconfined_t:file { read write };
allow bpf_pin_no_map_write_t unconfined_t:file { read write };
allow bpf_pin_no_prog_run_t unconfined_t:file { read write };
allow bpf_pin_all_rights_t unconfined_t:file { read write };

# Allow main BPF domain to access pinned files for testing.
allow bpf_map_read_write_t unconfined_t:file { read write };

# Enforce that the domain used in the lock test does not have lock permission.
neverallow bpf_map_read_write_t unconfined_t:file { lock };

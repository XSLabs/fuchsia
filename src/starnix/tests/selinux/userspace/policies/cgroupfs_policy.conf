# Default labeling for cgroup v2 filesystem nodes, applied when the filesystem is mounted
# without any SELinux mount option.
genfscon cgroup2 / system_u:object_r:unconfined_t:s0

# Label used with the `context=` mount option, which overrides the label of *every* node in
# the filesystem, including the root. Because the superblock itself takes this label, nodes
# are associated with a filesystem bearing the same label, hence the `self` rule below.
type test_cgroupfs_context_t, file_like_a;
allow test_cgroupfs_context_t self:filesystem { associate };

# Label used with the `rootcontext=` mount option, which overrides the label of the
# filesystem's root node only; all other nodes keep their genfscon label, and the superblock
# keeps the `unconfined_t` label assigned above.
type test_cgroupfs_rootcontext_t, file_like_a;
allow test_cgroupfs_rootcontext_t unconfined_t:filesystem { associate };

# Allow tmpfs_t to associate with its own filesystem for ScopedTempDir
allow tmpfs_t self:filesystem { associate };
